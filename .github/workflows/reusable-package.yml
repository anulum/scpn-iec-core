# SCPN IEC Core — reusable installed-wheel workflow

name: Installed wheel

on:
  workflow_call:

permissions: {}

jobs:
  run:
    name: Installed wheel in a clean environment
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12.16"
      - name: Install the hash-locked build backend
        run: python -m pip install --require-hashes -r requirements-build.txt
      - name: Build the wheel without build isolation
        run: python -m pip wheel --no-deps --no-build-isolation --wheel-dir dist .
      - name: Clean environment with the wheel only
        run: |
          python -m venv "$RUNNER_TEMP/clean"
          "$RUNNER_TEMP/clean/bin/python" -m pip install --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          env -u PYTHONPATH "$RUNNER_TEMP/clean/bin/python" -I "$GITHUB_WORKSPACE/tools/installed_package_check.py" --checkout "$GITHUB_WORKSPACE"
